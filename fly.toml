app = "aerophoenix"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"
swap_size_mb = 0

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_SERVER = "true"
  PHX_HOST = "aerophoenix.fly.dev"
  MIX_ENV = "prod"
  ECTO_IPV6 = "true"
  ERL_AFLAGS = "-proto_dist inet6_tcp"
  ORCHESTRATOR_URL = "http://aerophoenix-orchestrator.internal:4001"
  FLYD_SIM_URL = "http://aerophoenix-flyd-sim.internal:8080"
  PHX_TOPOLOGY_REFRESH_MS = "5000"
  ELIXIR_ERL_OPTIONS = "+sbwt none +sbwtdcpu none +sbwtdio none"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  
  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "15s"
    method = "get"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
