syntax = "proto3";
package aerophoenix.machine;

option go_package = "github.com/devghori1264/aerophoenix/flyd-sim/internal/proto;proto";

service MachineService {
  rpc Ping (PingRequest) returns (PingResponse);
  rpc CreateMachine (CreateRequest) returns (CreateResponse);
  rpc GetMachine (GetRequest) returns (GetResponse);
  rpc StartMachine (ActionRequest) returns (ActionResponse);
  rpc StopMachine (ActionRequest) returns (ActionResponse);
  rpc MigrateMachine (MigrateRequest) returns (MigrateResponse);
  rpc GetMigrationStatus (MigrationStatusRequest) returns (MigrationStatusResponse);
  rpc StreamMigrationProgress (MigrationStatusRequest) returns (stream MigrationProgressEvent);
}

message PingRequest {}
message PingResponse {
  string msg = 1;
}

message CreateRequest {
  string name = 1;
  string region = 2;
}

message CreateResponse {
  string id = 1;
  string status = 2;
}

message GetRequest { string id = 1; }
message GetResponse {
  string id = 1;
  string status = 2;
  string region = 3;
}

message ActionRequest { string id = 1; }
message ActionResponse { string result = 1; }


message MigrateRequest {
  string machine_id = 1;
  string target_region = 2;
  MigrationStrategy strategy = 3;
  MigrationOptions options = 4;
}

enum MigrationStrategy {
  STOP_AND_MOVE = 0;
  LIVE_MIGRATION = 1;
  CLONE_AND_REDIRECT = 2;
}

message MigrationOptions {
  int64 timeout_seconds = 1;
  bool preserve_ip = 2;
  bool skip_state_verification = 3;
  map<string, string> metadata = 4;
}

message MigrateResponse {
  string migration_id = 1;
  MigrationPhase current_phase = 2;
  string message = 3;
  int64 estimated_duration_ms = 4;
}

enum MigrationPhase {
  PHASE_UNKNOWN = 0;
  PHASE_VALIDATING = 1;
  PHASE_PREPARING_SOURCE = 2;
  PHASE_CREATING_TARGET = 3;
  PHASE_TRANSFERRING_STATE = 4;
  PHASE_VERIFYING_STATE = 5;
  PHASE_NETWORK_CUTOVER = 6;
  PHASE_CLEANUP = 7;
  PHASE_COMPLETED = 8;
  PHASE_FAILED = 9;
  PHASE_ROLLING_BACK = 10;
}

message MigrationStatusRequest {
  string migration_id = 1;
}

message MigrationStatusResponse {
  string migration_id = 1;
  MigrationPhase phase = 2;
  MigrationState state = 3;
  string source_region = 4;
  string target_region = 5;
  int64 bytes_transferred = 6;
  int64 total_bytes = 7;
  repeated MigrationStepStatus steps = 8;
  string error_message = 9;
  int64 started_at = 10;
  int64 completed_at = 11;
}

enum MigrationState {
  STATE_PENDING = 0;
  STATE_IN_PROGRESS = 1;
  STATE_COMPLETED = 2;
  STATE_FAILED = 3;
  STATE_ROLLED_BACK = 4;
}

message MigrationStepStatus {
  string step_name = 1;
  bool completed = 2;
  int64 duration_ms = 3;
  string error = 4;
}

message MigrationProgressEvent {
  string migration_id = 1;
  MigrationPhase phase = 2;
  int32 progress_percent = 3;
  string message = 4;
  int64 timestamp = 5;
}
